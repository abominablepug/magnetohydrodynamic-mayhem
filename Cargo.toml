[package]
name = "magnetohydrodynamic-mayhem"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
anyhow = "1.0.103"
bytemuck = "1.25.1"
pollster = "1.0.1"
wgpu = "30.0.0"
winit = "0.30.13"

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2.101"
wasm-bindgen-futures = "0.4.34"
web-sys = { version = "0.3.72", features = ["Window", "Document", "Element", "HtmlCanvasElement", "Gpu"] }
console_error_panic_hook = "0.1"
